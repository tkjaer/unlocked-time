name: Release

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:

  tag-guard:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Verify tag commit is on main
      run: |
        git fetch origin main:refs/remotes/origin/main
        if git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"; then
          echo "Tag commit is on main."
        else
          echo "Tag commit is not on main. Refusing to release."
          exit 1
        fi

  release:
    needs: tag-guard
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v5

    - name: Verify tag matches the bundle version
      run: |
        tag="${GITHUB_REF_NAME#v}"
        bundle=$(plutil -extract CFBundleShortVersionString raw App/Info.plist)
        if [ "$tag" != "$bundle" ]; then
          echo "Tag $tag does not match CFBundleShortVersionString $bundle."
          exit 1
        fi

    - name: Test
      run: swift test

    - name: Package the app
      run: |
        ./build-app.sh
        ditto -c -k --keepParent "dist/Unlocked Time.app" "dist/UnlockedTime-${GITHUB_REF_NAME}.zip"

    - name: Create the release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        cat > notes.md <<'NOTES'
        This build is ad-hoc signed. It is not signed with a Developer ID and not notarised, so
        macOS will refuse to open it normally.

        Until that changes, build from source:

            ./build-app.sh
            open "dist/Unlocked Time.app"
        NOTES
        gh release create "$GITHUB_REF_NAME" \
          "dist/UnlockedTime-${GITHUB_REF_NAME}.zip" \
          --title "$GITHUB_REF_NAME" \
          --prerelease \
          --notes-file notes.md
