name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Package the app
        run: ./build-app.sh

      - name: Check the bundle
        run: |
          plutil -lint "dist/Unlocked Time.app/Contents/Info.plist"
          test -f "dist/Unlocked Time.app/Contents/Resources/AppIcon.icns"
          codesign --verify --deep --strict "dist/Unlocked Time.app"
